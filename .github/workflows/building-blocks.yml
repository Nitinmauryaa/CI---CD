name: raju

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Create React app
        run: npx create-react-app my-app

      - name: Install dependencies
        working-directory: ./my-app
        run: npm install

      - name: Build app
        working-directory: ./my-app
        run: npm run build

    